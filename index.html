<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Penelope</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <h1>Penelope</h1>
        <div id="status" aria-live="polite">Ready</div>
        <label class="brush-size">
          <span>Size</span>
          <input
            id="brush-size"
            type="range"
            min="2"
            max="100"
            value="24"
            aria-label="Brush size"
          />
          <output id="brush-size-value" for="brush-size">24</output>
        </label>
        <label class="opacity">
          <span>Opacity</span>
          <input
            id="brush-opacity"
            type="range"
            min="0.05"
            max="1"
            step="0.05"
            value="1"
            aria-label="Brush opacity"
          />
          <output id="brush-opacity-value" for="brush-opacity">100%</output>
        </label>
        <label class="color">
          <span>Color</span>
          <input
            id="brush-color"
            type="color"
            value="#1a1a1a"
            aria-label="Brush color"
          />
        </label>
        <button type="button" id="clear" title="Clear canvas">Clear</button>
      </header>
      <main id="stage">
        <canvas id="canvas"></canvas>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
